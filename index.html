<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>今天吃什麼？轉盤</title>
<style>
  :root {
    --bg: #fff4d6;
    --ink: #2b2118;
    --accent: #e8452c;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  h1 { font-size: clamp(2rem, 7vw, 3.2rem); margin: 0 0 4px; letter-spacing: 2px; }
  .sub { margin: 0 0 20px; opacity: .7; }
  .wheel-wrap { position: relative; width: min(88vw, 400px); aspect-ratio: 1; }
  canvas { width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--ink); box-shadow: 0 8px 0 var(--ink); transition: transform 4s cubic-bezier(.12,.7,.1,1); }
  .pointer {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 32px solid var(--accent);
    filter: drop-shadow(0 2px 0 var(--ink));
    z-index: 2;
  }
  button {
    font: inherit; font-weight: 700; cursor: pointer;
    border: 3px solid var(--ink); border-radius: 12px;
    background: var(--accent); color: #fff;
    padding: 12px 28px; font-size: 1.2rem;
    box-shadow: 0 4px 0 var(--ink);
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 3px solid #1b6ef3; outline-offset: 2px; }
  #result { min-height: 3rem; font-size: 1.6rem; font-weight: 700; margin: 24px 0 12px; text-align: center; }
  .panel { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 16px; width: min(92vw, 420px); margin-top: 20px; }
  .panel h2 { margin: 0 0 10px; font-size: 1.1rem; }
  .add { display: flex; gap: 8px; }
  .add input { flex: 1; font: inherit; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 8px; min-width: 0; }
  .add button { padding: 8px 16px; font-size: 1rem; background: var(--ink); box-shadow: none; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
  li { background: var(--bg); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 6px 4px 12px; display: flex; align-items: center; gap: 6px; }
  li button { all: unset; cursor: pointer; width: 22px; height: 22px; text-align: center; border-radius: 50%; background: var(--ink); color: #fff; line-height: 22px; font-size: .9rem; }
  li button:focus-visible { outline: 3px solid #1b6ef3; }
  @media (prefers-reduced-motion: reduce) { canvas { transition: none; } }
</style>
</head>
<body>
  <h1>今天吃什麼？</h1>
  <p class="sub">不要再說「都可以」了，交給轉盤決定！</p>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="800" height="800" aria-label="食物轉盤"></canvas>
  </div>

  <div id="result" aria-live="polite"></div>
  <button id="spin">開始轉！</button>

  <div class="panel">
    <h2>想吃的東西</h2>
    <div class="add">
      <input id="newItem" type="text" maxlength="12" placeholder="例如：鹹酥雞" aria-label="新增選項">
      <button id="addBtn">新增</button>
    </div>
    <ul id="list"></ul>
  </div>

<script>
  let items = ["滷肉飯", "拉麵", "麥當勞", "珍珠奶茶", "水餃", "雞排", "牛肉麵", "壽司"];
  const colors = ["#ff8a5c", "#ffd166", "#06d6a0", "#4cc9f0", "#c77dff", "#ff6b9d", "#9bdb4d", "#f4a261"];

  try {
    const saved = JSON.parse(localStorage.getItem("foodItems"));
    if (Array.isArray(saved) && saved.length >= 2) items = saved;
  } catch (e) {}

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const spinBtn = document.getElementById("spin");
  const result = document.getElementById("result");
  const list = document.getElementById("list");
  let rotation = 0;

  function save() {
    try { localStorage.setItem("foodItems", JSON.stringify(items)); } catch (e) {}
  }

  function drawWheel() {
    const n = items.length, r = canvas.width / 2, step = (2 * Math.PI) / n;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < n; i++) {
      const a = i * step - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(r, r);
      ctx.arc(r, r, r, a, a + step);
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = "#2b2118";
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.save();
      ctx.translate(r, r);
      ctx.rotate(a + step / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#2b2118";
      ctx.font = "bold 40px sans-serif";
      ctx.fillText(items[i], r - 30, 14);
      ctx.restore();
    }
  }

  function renderList() {
    list.innerHTML = "";
    items.forEach((name, i) => {
      const li = document.createElement("li");
      li.textContent = name;
      const del = document.createElement("button");
      del.textContent = "×";
      del.setAttribute("aria-label", "刪除 " + name);
      del.onclick = () => {
        if (items.length <= 2) { result.textContent = "至少要留 2 個選項喔"; return; }
        items.splice(i, 1);
        save(); drawWheel(); renderList();
      };
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  function addItem() {
    const input = document.getElementById("newItem");
    const v = input.value.trim();
    if (!v) return;
    if (items.length >= 12) { result.textContent = "最多 12 個選項"; return; }
    items.push(v);
    input.value = "";
    save(); drawWheel(); renderList();
  }

  document.getElementById("addBtn").onclick = addItem;
  document.getElementById("newItem").addEventListener("keydown", e => { if (e.key === "Enter") addItem(); });

  spinBtn.onclick = () => {
    spinBtn.disabled = true;
    result.textContent = "轉轉轉…";
    const n = items.length, step = 360 / n;
    const winner = Math.floor(Math.random() * n);
    const center = winner * step + step / 2;
    const current = rotation % 360;
    rotation += 360 * 5 + ((360 - center - current) % 360 + 360) % 360;
    canvas.style.transform = "rotate(" + rotation + "deg)";
    const done = () => {
      result.textContent = "🎉 今天吃：" + items[winner] + "！";
      spinBtn.disabled = false;
    };
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) done(); else canvas.addEventListener("transitionend", done, { once: true });
  };

  drawWheel();
  renderList();
</script>
</body>
</html>
